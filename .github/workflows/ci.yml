name: ci

# Lint the provisioning shell scripts. There is no application code to build or
# unit-test here — the "product" is the scripts themselves — so CI focuses on:
#   1. shellcheck     — catch shell bugs (quoting, set -e interactions, etc.)
#   2. shfmt          — enforce the repo's formatting convention
#   3. lint-steps.sh  — ensure every scripts/NN-*.sh is wired into setup.sh
#   4. skill gates    — the engineering-team skill ships five structural gates
#                       under configs/claude/skills/engineering-team/scripts/ —
#                       check_report (evaluation reports), check_run (the
#                       run.yaml state file), check_plan (the improvement
#                       plan), check_board (the lane dashboard) and
#                       check_footprint (a branch's diff against its units'
#                       declared paths). Their selftests are their test, and a gate whose
#                       tests never run is the decoration that skill has a name for.
#   5. triggering test — headless selftest of the parsers in
#                       tests/engineering-team-triggering/run.py and
#                       tests/design-system-triggering/run.py. The skill's
#                       triggering measurement is LLM-in-the-loop and on-demand
#                       (not here), but its deterministic parsers are testable.
#   6. drift-scan     — tests/engineering-team-drift/drift_scan.py, fully
#                       headless, so it runs the REAL scan here (not just a
#                       selftest): the skill's rule-ownership index must not lie
#                       about where a rule lives, and the duplicated
#                       worktree-idiom commands must keep --path-format=absolute.
#   7. command-links  — tests/engineering-team-command-links/check_command_links.py,
#                       also fully headless, runs the REAL check here: every
#                       cross-reference the /done + /merge-push commands make into
#                       the skill tree must still resolve to a real file.
#   8. design-system scripts — selftests of the design-system skill's gate
#                       (check_design_system.py) and preview builder
#                       (design_preview.py), which projects copy, so a regression
#                       here would spread to every repo that uses them; and of
#                       render_previews.mjs and wordmark.py (via uv, for fontTools),
#                       and of the mockup tools (mockup.py, render_mockup.mjs).
#   9. skill versions — ci/lint-skill-versions.sh: every design-system script
#                       declares SCRIPT_VERSION, and a change to one bumps it,
#                       because copies in projects use it to tell they are behind.

#
# The rule for this workflow: its result must not depend on a service outside
# GitHub being up. It is the gate (/sync-skills merges on it), so a red here has
# to mean a defect in this repo, never a slow CDN. Tools come from GitHub
# release assets; the one Python package (fontTools) is cached and falls back
# to the cache when PyPI is unreachable. The container smoke test installs the
# real tools from the internet by design, so it lives in smoke.yml and never
# gates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        # PINNED, like shfmt below. `apt-get install shellcheck` floats with the
        # runner image, and the versions disagree about which check number to
        # emit: 0.11 reports a function invoked only through `retry` as SC2329,
        # while the version on the runner reported the same situation as SC2317
        # on the function's body lines. A file that was clean locally therefore
        # failed in CI for a reason no local run could reproduce. Bump this in
        # lockstep with docs/development.md.
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            -o /tmp/shellcheck.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          shellcheck setup.sh deploy-engineering-team-skill.sh scripts/*.sh ci/*.sh \
            bin/setup-status bin/codespaces-update .devcontainer/post-create.sh \
            tests/setup-resilience/run.sh tests/claude-config-dir/run.sh \
            configs/claude/scripts/sync-skills.sh tests/sync-skills/run.sh

      - name: shfmt
        # Pinned to match the local shfmt convention; bump in lockstep with docs.
        # The GitHub release binary, not the Docker Hub image this used to be:
        # Docker Hub is a service outside GitHub, and this workflow must not
        # depend on one (see the rule at the top).
        env:
          SHFMT_VERSION: v3.13.1
        run: |
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" \
            -o /tmp/shfmt
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version
          # Keep these flags in sync with docs/development.md and the local
          # convention: 2-space indent, indent switch cases, keep alignment.
          shfmt -i 2 -ci -kp -d setup.sh deploy-engineering-team-skill.sh scripts ci bin .devcontainer configs/claude/scripts tests/sync-skills

      - name: steps-array wiring
        run: bash ci/lint-steps.sh

      - name: per-script conventions
        # CLAUDE.md's per-script conventions had zero enforcement: a script with
        # no `set -euo pipefail`, no log() prefix, an unretried `curl | bash` and
        # a .bak written into the SCANNED ~/.claude/skills/ directory passed
        # every gate green. --selftest proves each rule can still go red.
        run: |
          bash ci/lint-conventions.sh --selftest
          bash ci/lint-conventions.sh

      - name: shell config syntax
        # configs/.zshrc has the largest blast radius in the repo - it deploys
        # via the account-wide dotfiles route into EVERY Codespace on every repo,
        # and a syntax error there breaks every new shell *and* silences the
        # setup-failure notice it hosts. Nothing checked it.
        run: |
          # Ubuntu's package mirror for the runner is part of GitHub's runner
          # setup; retries cover its brief blips.
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y zsh
          zsh -n configs/.zshrc
          zsh -n configs/.zsh_aliases

      - name: devcontainer manifest
        # Never parsed by anything. A trailing comma here breaks container
        # creation for this repo and surfaces only when someone creates a
        # Codespace.
        run: python3 -c "import json,sys; json.load(open('.devcontainer/devcontainer.json'))"

      - name: engineering-team gates (fixtures)
        run: |
          python3 configs/claude/skills/engineering-team/scripts/check_report.py --selftest
          python3 configs/claude/skills/engineering-team/scripts/check_run.py --selftest
          python3 configs/claude/skills/engineering-team/scripts/check_plan.py --selftest
          python3 configs/claude/skills/engineering-team/scripts/check_board.py --selftest
          python3 configs/claude/skills/engineering-team/scripts/check_footprint.py --selftest
          python3 configs/claude/skills/engineering-team/scripts/context_usage.py --selftest
          python3 configs/claude/skills/engineering-team/scripts/model_usage.py --selftest

      - name: design-system scripts (selftest)
        # The skill's gate and preview builder are copied into each project that
        # uses them, so a regression here spreads. Those two are stdlib-only and
        # carry their own fixtures; the selftests prove each check can go red.
        run: |
          python3 configs/claude/skills/design-system/scripts/check_design_system.py --selftest
          python3 configs/claude/skills/design-system/scripts/design_preview.py --selftest
          # No Playwright needed: it checks the page assembly and that its CSS
          # comes from design_preview.py, not a second compiler.
          node configs/claude/skills/design-system/scripts/render_previews.mjs --selftest
          # The mockup tools run from the skill (never copied), but every project's
          # mockups go through them: the builder's theme contract and folder rules,
          # and the renderer's shot list.
          python3 configs/claude/skills/design-system/scripts/mockup.py --selftest
          node configs/claude/skills/design-system/scripts/render_mockup.mjs --selftest

      - name: set up uv (for wordmark.py's fontTools)
        uses: astral-sh/setup-uv@v6
        with:
          # Keep the downloaded wheels in GitHub's cache, so a PyPI outage
          # doesn't redden this workflow. prune-cache defaults to true, which
          # drops exactly those wheels, so it is off.
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: configs/claude/skills/design-system/scripts/wordmark.py

      - name: design-system wordmark (selftest)
        # Builds its own two-glyph font, so no font file lives in the repo.
        # When PyPI can't be reached, the second try resolves from the cache
        # alone. A real test failure fails both tries. brotli too: it is the
        # set the sync-skills test's own check asks for, so one cached set
        # serves both.
        env:
          WORDMARK: configs/claude/skills/design-system/scripts/wordmark.py
        run: |
          uv run --with fonttools --with brotli python3 "${WORDMARK}" --selftest ||
            uv run --offline --with fonttools --with brotli python3 "${WORDMARK}" --selftest

      - name: skill script versions
        # Copies of the design-system scripts compare their SCRIPT_VERSION with
        # the installed skill's, so a change here that forgets the bump leaves
        # every stale copy reporting itself current. Compare against the PR's
        # base, or the previous commit on a push. With no base (a manual run, a
        # new branch) only presence and block identity are checked. A PR base
        # that cannot be fetched fails the step rather than quietly skipping the
        # bump rule; a push's `before` may be gone after a force-push, so that
        # case warns and falls back.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash ci/lint-skill-versions.sh --selftest
          if [[ -z "${BASE}" || "${BASE}" == 0000000000000000000000000000000000000000 ]]; then
            echo "no base commit to compare with; checking presence and block identity only"
            bash ci/lint-skill-versions.sh
          elif git fetch -q --depth=1 origin "${BASE}"; then
            bash ci/lint-skill-versions.sh --base "${BASE}"
          elif [[ "${EVENT}" == pull_request ]]; then
            echo "::error::could not fetch the PR base ${BASE}; the version-bump rule cannot run"
            exit 1
          else
            echo "::warning::could not fetch ${BASE} (force-pushed?); checking presence and block identity only"
            bash ci/lint-skill-versions.sh
          fi

      - name: triggering-eval parser selftest
        # The LLM routing in this test is on-demand (not in CI), but its
        # deterministic parsers — where a silent bug yields a confident wrong
        # number — are headless-testable. This runs only those checks.
        run: |
          python3 tests/engineering-team-triggering/run.py --selftest
          python3 tests/design-system-triggering/run.py --selftest

      - name: rule-ownership drift-scan
        # Fully headless (pure text analysis), so unlike the probe/triggering
        # tests it runs the real scan in CI, not just a selftest: the skill's
        # rule-ownership index must not lie about where a rule lives, and the
        # duplicated worktree-idiom commands must keep --path-format=absolute.
        run: |
          python3 tests/engineering-team-drift/drift_scan.py --selftest
          python3 tests/engineering-team-drift/drift_scan.py

      - name: command→skill link-check
        # Also fully headless, so it runs the real check here: the /done and
        # /merge-push commands cross-reference skill files by hardcoded path, and
        # those ship separately — a rename inside the skill strands the pointer
        # silently. This reds before that reaches a Codespace.
        run: |
          python3 tests/engineering-team-command-links/check_command_links.py --selftest
          python3 tests/engineering-team-command-links/check_command_links.py

      - name: setup-resilience test
        # Fully headless (no network/sudo/LLM): drives the real setup.sh over a
        # throwaway set of fake steps via its SETUP_* env hooks and asserts a
        # failing step no longer aborts the run, the summary names it, the exit
        # code is non-zero, and a durable signal file is left behind. Also
        # unit-tests the shared retry helper (scripts/lib.sh).
        run: bash tests/setup-resilience/run.sh

      - name: claude-config-dir test
        # Headless, filesystem-only: runs the real 19-claude-config-dir.sh against
        # a throwaway HOME and asserts the merge, the links and idempotence.
        run: bash tests/claude-config-dir/run.sh

      - name: sync-skills test
        # The /sync-skills script, run as a machine would, against a bare clone
        # standing in for GitHub: the three-way plan, a conflict, a pull, the
        # push path up to the PR, a restart on a newer copy of itself, and (with
        # a fake gh) the merge gate that waits on this workflow alone. Runs
        # the skill checks too, so it needs node and uv (set up above). gh only
        # has to report itself signed in.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/sync-skills/run.sh
