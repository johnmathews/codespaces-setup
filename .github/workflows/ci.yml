name: ci

# Lint the provisioning shell scripts. There is no application code to build or
# unit-test here — the "product" is the scripts themselves — so CI focuses on:
#   1. shellcheck     — catch shell bugs (quoting, set -e interactions, etc.)
#   2. shfmt          — enforce the repo's formatting convention
#   3. lint-steps.sh  — ensure every scripts/NN-*.sh is wired into setup.sh
#   4. skill gates    — the engineering-team skill ships three structural gates
#                       under configs/claude/skills/engineering-team/scripts/ —
#                       check_report (evaluation reports), check_run (the
#                       run.yaml state file), and check_plan (the improvement
#                       plan). Their fixtures are their test, and a gate whose
#                       tests never run is the decoration that skill has a name for.
#   5. triggering test — headless selftest of the parsers in
#                       tests/engineering-team-triggering/run.py. The skill's
#                       triggering measurement is LLM-in-the-loop and on-demand
#                       (not here), but its deterministic parsers are testable.
#   6. drift-scan     — tests/engineering-team-drift/drift_scan.py, fully
#                       headless, so it runs the REAL scan here (not just a
#                       selftest): the skill's rule-ownership index must not lie
#                       about where a rule lives, and the duplicated
#                       worktree-idiom commands must keep --path-format=absolute.
#   7. command-links  — tests/engineering-team-command-links/check_command_links.py,
#                       also fully headless, runs the REAL check here: every
#                       cross-reference the /done + /merge-push commands make into
#                       the skill tree must still resolve to a real file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck setup.sh deploy-engineering-team-skill.sh scripts/*.sh ci/*.sh

      - name: shfmt
        # Pinned to match the local shfmt convention; bump in lockstep with docs.
        uses: docker://mvdan/shfmt:v3.13.1
        with:
          # Keep these flags in sync with docs/development.md and the local
          # convention: 2-space indent, indent switch cases, keep alignment.
          args: -i 2 -ci -kp -d setup.sh deploy-engineering-team-skill.sh scripts ci

      - name: steps-array wiring
        run: bash ci/lint-steps.sh

      - name: engineering-team gates (fixtures)
        run: |
          python3 configs/claude/skills/engineering-team/scripts/check_report.py --selftest
          python3 configs/claude/skills/engineering-team/scripts/check_run.py --selftest
          python3 configs/claude/skills/engineering-team/scripts/check_plan.py --selftest
          python3 configs/claude/skills/engineering-team/scripts/check_board.py --selftest

      - name: triggering-eval parser selftest
        # The LLM routing in this test is on-demand (not in CI), but its
        # deterministic parsers — where a silent bug yields a confident wrong
        # number — are headless-testable. This runs only those checks.
        run: python3 tests/engineering-team-triggering/run.py --selftest

      - name: rule-ownership drift-scan
        # Fully headless (pure text analysis), so unlike the probe/triggering
        # tests it runs the real scan in CI, not just a selftest: the skill's
        # rule-ownership index must not lie about where a rule lives, and the
        # duplicated worktree-idiom commands must keep --path-format=absolute.
        run: |
          python3 tests/engineering-team-drift/drift_scan.py --selftest
          python3 tests/engineering-team-drift/drift_scan.py

      - name: command→skill link-check
        # Also fully headless, so it runs the real check here: the /done and
        # /merge-push commands cross-reference skill files by hardcoded path, and
        # those ship separately — a rename inside the skill strands the pointer
        # silently. This reds before that reaches a Codespace.
        run: |
          python3 tests/engineering-team-command-links/check_command_links.py --selftest
          python3 tests/engineering-team-command-links/check_command_links.py

      - name: setup-resilience test
        # Fully headless (no network/sudo/LLM): drives the real setup.sh over a
        # throwaway set of fake steps via its SETUP_* env hooks and asserts a
        # failing step no longer aborts the run, the summary names it, the exit
        # code is non-zero, and a durable signal file is left behind. Also
        # unit-tests the shared retry helper (scripts/lib.sh).
        run: bash tests/setup-resilience/run.sh
